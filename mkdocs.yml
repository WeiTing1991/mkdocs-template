site_name: Docs Template
site_description: Documentation template with Python, C++, and C# support
site_url: https://weiting1991.github.io/mkdocs-template/
repo_url: https://github.com/WeiTing1991/mkdocs-template
repo_name: WeiTing1991/mkdocs-template
docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Python:
      - Overview: python/index.md
      - API Reference: python/api.md
  - C++:
      - Overview: cpp/index.md
      - API Reference: cpp/api.md
  - C#:
      - Overview: csharp/index.md
      - API Reference: csharp/api.md

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src/python
          options:
            docstring_style: google
            show_source: true
            heading_level: 2
  - mkdoxy:
      projects:
        cpp_example:
          src-dirs: src/cpp/
          full-doc: true
        csharp_example:
          src-dirs: src/csharp/
          full-doc: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.inlinehilite
  - pymdownx.details
