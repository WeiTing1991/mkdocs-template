[project]
site_name = "Docs Template"
site_description = "Documentation template with Python, C++, and C# support"
site_url = "https://weiting1991.github.io/mkdocs-template/"
repo_url = "https://github.com/WeiTing1991/mkdocs-template"
repo_name = "WeiTing1991/mkdocs-template"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Python" = [
    { "Overview" = "python/index.md" },
    { "API Reference" = "python/api.md" },
  ]},
  { "C++" = [
    { "Overview" = "cpp/index.md" },
    { "API Reference" = "cpp/api.md" },
  ]},
  { "C#" = [
    { "Overview" = "csharp/index.md" },
    { "API Reference" = "csharp/api.md" },
  ]},
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src/python"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
heading_level = 2

[project.plugins.mkdoxy]

[project.plugins.mkdoxy.projects.cpp_example]
src-dirs = "src/cpp/"
full-doc = true

[project.plugins.mkdoxy.projects.csharp_example]
src-dirs = "src/csharp/"
full-doc = true

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc = { permalink = true }
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true,
}
pymdownx.inlinehilite = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
